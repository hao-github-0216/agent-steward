name: CI

# 每次推送:在 macOS、Linux、Windows 上模擬「全新電腦」實際跑一次
# 安裝(自己下載 Node、從 fork 下載 herdr、ttyd)→ 啟動 → 健康檢查 → 再裝一次(更新)→ 移除。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # PATH 裡沒有 Node、沒有 Homebrew
      FRESH_PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
      - name: Fresh home directory
        run: echo "FRESH_HOME=$RUNNER_TEMP/fresh-home" >> "$GITHUB_ENV"
      - name: Shell syntax
        run: sh -n install.sh && sh -n uninstall.sh
      - name: Refuse unattended installation without --yes
        run: |
          T=$(mktemp -d)
          trap 'rm -rf "$T"' EXIT
          if env -i HOME="$T" PATH="$FRESH_PATH" LANG=en_US.UTF-8 sh install.sh --from . </dev/null; then
            echo "Installation should require --yes without a terminal"; exit 1
          fi
          test ! -e "$T/.agent-steward"
          test ! -e "$T/.local"
          test -z "$(ls -A "$T")"
      - name: Dry run is read-only and detects the language
        run: |
          for CASE in en zh override; do
            T=$(mktemp -d)
            trap 'rm -rf "$T"' EXIT
            if [ "$CASE" = en ]; then
              env -i HOME="$T" PATH="$FRESH_PATH" LANG=en_US.UTF-8 sh install.sh --from . --dry-run > "$RUNNER_TEMP/dry-run.log"
              grep -q 'agent-steward .* installer' "$RUNNER_TEMP/dry-run.log"
            elif [ "$CASE" = zh ]; then
              env -i HOME="$T" PATH="$FRESH_PATH" LANG=zh_TW.UTF-8 sh install.sh --from . --dry-run > "$RUNNER_TEMP/dry-run.log"
              grep -q '安裝程式 — 看完再決定要不要裝' "$RUNNER_TEMP/dry-run.log"
            else
              env -i HOME="$T" PATH="$FRESH_PATH" LANG=zh_TW.UTF-8 sh install.sh --from . --dry-run --lang en > "$RUNNER_TEMP/dry-run.log"
              grep -q 'agent-steward .* installer' "$RUNNER_TEMP/dry-run.log"
            fi
            test -z "$(ls -A "$T")"
            rm -rf "$T"
          done
      - name: Install on a "fresh machine" (curl | sh, like the README)
        run: |
          mkdir -p "$FRESH_HOME"
          env -i HOME="$FRESH_HOME" PATH="$FRESH_PATH" LANG=en_US.UTF-8 STEWARD_FORCE_NODE_DOWNLOAD=1 \
            sh -c 'curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | sh -s -- --from "$0" --no-service --yes' "$PWD" 2>&1 | tee install.log
          grep -q "Installed to" install.log
      - name: Installation receipt exists
        run: |
          test -f "$FRESH_HOME/.agent-steward/install.json"
          grep -q '"lang"' "$FRESH_HOME/.agent-steward/install.json"
          grep -q '"version": 1' "$FRESH_HOME/.agent-steward/install.json"
      - name: Check what got installed
        run: |
          set -x
          test -x "$FRESH_HOME/.agent-steward/node/bin/node"
          "$FRESH_HOME/.agent-steward/node/bin/node" -v
          "$FRESH_HOME/.local/bin/herdr" --version
          test -x "$FRESH_HOME/.local/bin/steward"
          ls "$FRESH_HOME/.config/herdr/plugins-local"
          env -i HOME="$FRESH_HOME" "$FRESH_HOME/.local/bin/herdr" plugin list
          grep -q "folder_nav.mjs" "$FRESH_HOME/.config/herdr/config.toml"
          # macOS 沒有 Homebrew → 要看到補裝網頁終端機的說明;Linux 要下載到 ttyd
          if [ "$RUNNER_OS" = macOS ]; then grep -qi "brew" install.log; else test -x "$FRESH_HOME/.agent-steward/bin/ttyd"; fi
      - name: Start and health check
        run: |
          cd "$FRESH_HOME/.agent-steward/app"
          env -i HOME="$FRESH_HOME" PATH="$FRESH_PATH" "$FRESH_HOME/.agent-steward/node/bin/node" --experimental-strip-types --no-warnings src/main.ts > "$RUNNER_TEMP/steward.log" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8791/api/health && kill $PID && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/steward.log"; exit 1
      - name: Install again (update path)
        run: env -i HOME="$FRESH_HOME" PATH="$FRESH_PATH" LANG=en_US.UTF-8 sh install.sh --from . --no-service --yes
      - name: One-click update from an older app
        run: |
          printf '%s000\n' "$(date +%s)" > "$FRESH_HOME/.agent-steward/update.lock"
          env -i HOME="$FRESH_HOME" PATH="$FRESH_PATH" LANG=en_US.UTF-8 sh install.sh --from . --no-service </dev/null
      - name: Uninstall
        run: |
          env -i HOME="$FRESH_HOME" PATH="$FRESH_PATH" sh "$FRESH_HOME/.agent-steward/app/uninstall.sh" --purge
          test ! -e "$FRESH_HOME/.agent-steward"
          test ! -e "$FRESH_HOME/.local/bin/steward"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($f in "install.ps1", "scripts/install-windows.ps1", "uninstall.ps1") {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs; exit 1 }
          }
      - name: Refuse unattended installation without -Yes
        shell: powershell
        run: |
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding $false
          $OutputEncoding = [Console]::OutputEncoding
          $probe = Join-Path $env:RUNNER_TEMP "steward-installer-probe.ps1"
          @'
          param([switch]$DryRun, [string]$Lang)
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding $false
          $OutputEncoding = [Console]::OutputEncoding
          if ($HOME -ne $env:STEWARD_TEST_HOME) { throw "Child HOME is not isolated: $HOME" }
          Write-Output "HOME_OK=$HOME"
          $global:LASTEXITCODE = 0
          $options = @{ From = $env:STEWARD_TEST_REPO }
          if ($DryRun) { $options.DryRun = $true }
          if ($Lang) { $options.Lang = $Lang }
          & (Join-Path $env:STEWARD_TEST_REPO "install.ps1") @options
          exit $LASTEXITCODE
          '@ | Set-Content -Encoding UTF8 $probe
          $T = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP ("h-" + [guid]::NewGuid()))
          $oldProfile = $env:USERPROFILE
          $oldHome = $env:HOME
          try {
            $env:STEWARD_TEST_HOME = $T.FullName
            $env:STEWARD_TEST_REPO = (Get-Location).Path
            $env:USERPROFILE = $T.FullName
            $env:HOME = $T.FullName
            $output = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $probe
            $code = $LASTEXITCODE
            $log = Join-Path $env:RUNNER_TEMP "refuse-install.log"
            $output | Out-File -Encoding UTF8 $log
            $text = Get-Content $log -Raw -Encoding UTF8
            Write-Host $text
            if ($text -notlike "*HOME_OK=$($T.FullName)*") { throw "Child HOME was not verified" }
            if ($code -eq 0) { throw "Installation should require -Yes without a terminal" }
            if ($text -notlike "*This window is not interactive*") { throw "Installer did not refuse with the expected message" }
            if (@(Get-ChildItem -LiteralPath $T.FullName -Force).Count) { throw "Refused installation wrote to HOME" }
          } finally {
            $env:USERPROFILE = $oldProfile
            $env:HOME = $oldHome
            Remove-Item -Recurse -Force $T.FullName
          }
      - name: Dry run is read-only and supports both languages
        shell: powershell
        run: |
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding $false
          $OutputEncoding = [Console]::OutputEncoding
          $probe = Join-Path $env:RUNNER_TEMP "steward-installer-probe.ps1"
          $oldProfile = $env:USERPROFILE
          $oldHome = $env:HOME
          foreach ($lang in @("", "zh-TW")) {
            $T = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP ("h-" + [guid]::NewGuid()))
            try {
              $env:STEWARD_TEST_HOME = $T.FullName
              $env:STEWARD_TEST_REPO = (Get-Location).Path
              $env:USERPROFILE = $T.FullName
              $env:HOME = $T.FullName
              $options = @("-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", $probe, "-DryRun")
              if ($lang) { $options += @("-Lang", $lang) }
              $output = & powershell @options
              $code = $LASTEXITCODE
              $log = Join-Path $env:RUNNER_TEMP "dry-run.log"
              $output | Out-File -Encoding UTF8 $log
              $text = Get-Content $log -Raw -Encoding UTF8
              Write-Host $text
              if ($text -notlike "*HOME_OK=$($T.FullName)*") { throw "Child HOME was not verified" }
              if ($code -ne 0) { throw "Dry run failed: $code" }
              if ($lang -eq "zh-TW") {
                if ($text -notmatch "安裝程式 — 看完再決定要不要裝") { throw "Missing Chinese title" }
              } elseif ($text -notmatch "agent-steward .* installer") { throw "Missing English title" }
              if (@(Get-ChildItem -LiteralPath $T.FullName -Force).Count) { throw "Dry run wrote to HOME" }
            } finally {
              $env:USERPROFILE = $oldProfile
              $env:HOME = $oldHome
              Remove-Item -Recurse -Force $T.FullName
            }
          }
      - name: Install with Windows PowerShell 5.1 on a "fresh machine" (irm | iex, like the README)
        shell: powershell
        env:
          STEWARD_FORCE_NODE_DOWNLOAD: "1"
          STEWARD_NO_SERVICE: "1"
          STEWARD_YES: "1"
        run: |
          $env:STEWARD_FROM = (Get-Location).Path
          $env:STEWARD_REF = "${{ github.sha }}"
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          if (-not (Test-Path "$HOME\.agent-steward\app\src\main.ts")) { throw "安裝沒有完成" }
      - name: Installation receipt exists
        shell: powershell
        run: |
          $receipt = Join-Path $HOME ".agent-steward\install.json"
          if (-not (Test-Path $receipt)) { throw "Missing installation receipt" }
          $text = Get-Content $receipt -Raw -Encoding UTF8
          if ($text -notmatch '"lang"') { throw "Receipt has no language" }
          $data = $text | ConvertFrom-Json
          if ($data.lang -notin @("zh-TW", "en")) { throw "Invalid receipt language" }
      - name: Check what got installed
        shell: pwsh
        run: |
          $r = Join-Path $HOME ".agent-steward"
          & "$r\node\node.exe" -v
          & "$r\bin\herdr\herdr.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$r\bin\ttyd.exe")) { throw "沒有 ttyd.exe" }
          if (-not (Test-Path "$HOME\.local\bin\steward.cmd")) { throw "沒有 steward.cmd" }
          Get-ChildItem "$env:APPDATA\herdr\plugins-local"
          & "$r\bin\herdr\herdr.exe" plugin list
          if (-not (Select-String -Quiet -Path "$env:APPDATA\herdr\config.toml" -Pattern "folder-nav.cmd")) { throw "herdr 設定裡沒有資料夾導覽" }
          Get-Content "$r\bin\folder-nav.cmd"
          $first = ([Environment]::GetEnvironmentVariable("Path", "User") -split ";")[0]
          if ($first -ne "$r\bin\herdr") { throw "PATH 第一個不是專案管家的 herdr:$first" }
      - name: Start and health check
        shell: pwsh
        run: |
          $r = Join-Path $HOME ".agent-steward"
          $p = Start-Process "$r\node\node.exe" -ArgumentList "--experimental-strip-types", "--no-warnings", "src\main.ts" -WorkingDirectory "$r\app" -RedirectStandardError "$HOME\steward.err.log" -RedirectStandardOutput "$HOME\steward.log" -PassThru
          for ($i = 0; $i -lt 40; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8791/api/health; Stop-Process -Id $p.Id -Force; exit 0 } catch { Start-Sleep 1 }
          }
          Get-Content "$HOME\steward.err.log"; exit 1
      - name: Install again with -File (update path, start-on-login is best effort; CI has no interactive logon)
        continue-on-error: true
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -From . -NoOpen -Yes
      - name: One-click update from an older app
        shell: powershell
        run: |
          [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() | Set-Content -Encoding ascii "$HOME\.agent-steward\update.lock"
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 -From . -NoOpen
          if ($LASTEXITCODE -ne 0) { throw "One-click update from an older app failed: $LASTEXITCODE" }
      - name: Options reach the real installer (-From . installs this commit)
        shell: pwsh
        run: |
          $rev = (Get-Content "$HOME\.agent-steward\app\REVISION" -Raw).Trim()
          $want = (git rev-parse --short HEAD).Trim()
          "installed=$rev expected=$want"
          if ($rev -ne $want) { throw "-From 沒有傳到安裝程式" }
      - name: Scheduled tasks
        continue-on-error: true
        shell: pwsh
        run: Get-ScheduledTask -TaskName "agent-steward*" | Format-Table TaskName, State
      - name: Uninstall
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File %USERPROFILE%\.agent-steward\app\uninstall.ps1 -Purge
      - name: Check uninstall
        shell: pwsh
        run: |
          if (Test-Path "$HOME\.agent-steward") { throw "還有 .agent-steward" }
          if (Get-ScheduledTask -TaskName "agent-steward*" -ErrorAction SilentlyContinue) { throw "排程工作還在" }

  plugins:
    # 外掛實際安裝:TinyTeX、uv + Python + Jupyter;用 TinyTeX 編中文與缺套件的文件
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Install and use plugins
        shell: bash
        run: |
          export STEWARD_DATA_DIR="$RUNNER_TEMP/steward-data"
          mkdir -p "$RUNNER_TEMP/work"
          node --experimental-strip-types --no-warnings scripts/ci-plugins.mjs "$RUNNER_TEMP/work"

  unit:
    # 單元測試(test/*.test.mjs);Windows 先跑看看,失敗不擋
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm test

