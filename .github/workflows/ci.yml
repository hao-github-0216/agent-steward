name: CI

# 在 macOS、Linux 上從儲存庫安裝，下載 Node、herdr 與 ttyd，啟動並檢查健康狀態後移除。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Check component pins against official sources
        run: node scripts/pin-components.mjs --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify the Node.js checksum signature and pinned hashes
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("components.json", "utf8")).components.find(c => c.id === "node").version)')
          T=$(mktemp -d)
          trap 'rm -rf "$T"' EXIT
          git clone --depth 1 https://github.com/nodejs/release-keys "$T/release-keys"
          curl --proto '=https' --tlsv1.2 -fsSL "https://nodejs.org/dist/v$VERSION/SHASUMS256.txt" -o "$T/SHASUMS256.txt"
          curl --proto '=https' --tlsv1.2 -fsSL "https://nodejs.org/dist/v$VERSION/SHASUMS256.txt.sig" -o "$T/SHASUMS256.txt.sig"
          mkdir "$T/gnupg"
          GNUPGHOME="$T/gnupg" gpgv --keyring "$T/release-keys/gpg-only-active-keys/pubring.kbx" "$T/SHASUMS256.txt.sig" "$T/SHASUMS256.txt"
          node --input-type=module - "$T/SHASUMS256.txt" <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("components.json", "utf8"));
          const sums = new Map(readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).map(line => {
            const match = line.match(/^([a-f0-9]{64})[ \t]+\*?(.+)$/);
            if (!match) throw new Error(`Invalid checksum line: ${line}`);
            return [match[2], match[1]];
          }));
          for (const file of Object.values(manifest.components.find(c => c.id === "node").files)) {
            if (sums.get(file.name) !== file.sha256) throw new Error(`Node checksum mismatch: ${file.name}`);
            console.log(`Verified signed checksum: ${file.name}`);
          }
          NODE

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # PATH 裡沒有 Node、沒有 Homebrew
      FRESH_PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
      - name: Fresh home directory
        run: echo "FRESH_HOME=$RUNNER_TEMP/fresh-home" >> "$GITHUB_ENV"
      - name: Shell syntax
        run: sh -n scripts/dev/install.sh && sh -n scripts/dev/uninstall.sh
      - name: Refuse installation without --from
        run: |
          T=$(mktemp -d)
          trap 'rm -rf "$T"' EXIT
          if env -i HOME="$T" PATH="$FRESH_PATH" LANG=en_US.UTF-8 sh scripts/dev/install.sh --yes > "$RUNNER_TEMP/no-from.log" 2>&1; then
            echo "Installation should require --from"; exit 1
          fi
          grep -q 'releases/latest' "$RUNNER_TEMP/no-from.log"
          test -z "$(ls -A "$T")"
      - name: Refuse unattended installation without --yes
        run: |
          T=$(mktemp -d)
          trap 'rm -rf "$T"' EXIT
          if env -i HOME="$T" PATH="$FRESH_PATH" LANG=en_US.UTF-8 sh scripts/dev/install.sh --from . </dev/null; then
            echo "Installation should require --yes without a terminal"; exit 1
          fi
          test ! -e "$T/.agent-steward"
          test ! -e "$T/.local"
          test -z "$(ls -A "$T")"
      - name: Dry run is read-only and detects the language
        run: |
          for CASE in en zh override; do
            T=$(mktemp -d)
            trap 'rm -rf "$T"' EXIT
            if [ "$CASE" = en ]; then
              env -i HOME="$T" PATH="$FRESH_PATH" LANG=en_US.UTF-8 sh scripts/dev/install.sh --from . --dry-run > "$RUNNER_TEMP/dry-run.log"
              grep -q 'agent-steward .* installer' "$RUNNER_TEMP/dry-run.log"
            elif [ "$CASE" = zh ]; then
              env -i HOME="$T" PATH="$FRESH_PATH" LANG=zh_TW.UTF-8 sh scripts/dev/install.sh --from . --dry-run > "$RUNNER_TEMP/dry-run.log"
              grep -q '安裝程式 — 看完再決定要不要裝' "$RUNNER_TEMP/dry-run.log"
            else
              env -i HOME="$T" PATH="$FRESH_PATH" LANG=zh_TW.UTF-8 sh scripts/dev/install.sh --from . --dry-run --lang en > "$RUNNER_TEMP/dry-run.log"
              grep -q 'agent-steward .* installer' "$RUNNER_TEMP/dry-run.log"
            fi
            test -z "$(ls -A "$T")"
            rm -rf "$T"
          done
      - name: Install from the repository on a fresh machine
        run: |
          mkdir -p "$FRESH_HOME"
          env -i HOME="$FRESH_HOME" PATH="$FRESH_PATH" LANG=en_US.UTF-8 STEWARD_FORCE_NODE_DOWNLOAD=1 \
            sh scripts/dev/install.sh --from . --no-service --yes 2>&1 | tee install.log
          grep -q "Installed to" install.log
      - name: Installation receipt exists
        run: |
          test -f "$FRESH_HOME/.agent-steward/install.json"
          grep -q '"lang"' "$FRESH_HOME/.agent-steward/install.json"
          grep -q '"version": 1' "$FRESH_HOME/.agent-steward/install.json"
      - name: Check what got installed
        run: |
          set -x
          test -x "$FRESH_HOME/.agent-steward/node/bin/node"
          "$FRESH_HOME/.agent-steward/node/bin/node" -v
          "$FRESH_HOME/.local/bin/herdr" --version
          test -x "$FRESH_HOME/.local/bin/steward"
          ls "$FRESH_HOME/.config/herdr/plugins-local"
          env -i HOME="$FRESH_HOME" "$FRESH_HOME/.local/bin/herdr" plugin list
          grep -q "folder_nav.mjs" "$FRESH_HOME/.config/herdr/config.toml"
          # macOS 沒有 Homebrew → 要看到補裝網頁終端機的說明;Linux 要下載到 ttyd
          if [ "$RUNNER_OS" = macOS ]; then grep -qi "brew" install.log; else test -x "$FRESH_HOME/.agent-steward/bin/ttyd"; fi
      - name: Start and health check
        run: |
          cd "$FRESH_HOME/.agent-steward/app"
          env -i HOME="$FRESH_HOME" PATH="$FRESH_PATH" "$FRESH_HOME/.agent-steward/node/bin/node" --experimental-strip-types --no-warnings src/main.ts > "$RUNNER_TEMP/steward.log" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8791/api/health && kill $PID && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/steward.log"; exit 1
      - name: Uninstall
        run: |
          env -i HOME="$FRESH_HOME" PATH="$FRESH_PATH" sh "$FRESH_HOME/.agent-steward/app/scripts/dev/uninstall.sh" --purge
          test ! -e "$FRESH_HOME/.agent-steward"
          test ! -e "$FRESH_HOME/.local/bin/steward"

  plugins:
    # 外掛實際安裝:TinyTeX、uv + Python + Jupyter;用 TinyTeX 編中文與缺套件的文件
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Install and use plugins
        shell: bash
        run: |
          export STEWARD_DATA_DIR="$RUNNER_TEMP/steward-data"
          mkdir -p "$RUNNER_TEMP/work"
          node --experimental-strip-types --no-warnings scripts/ci-plugins.mjs "$RUNNER_TEMP/work"

  unit:
    # 單元測試(test/*.test.mjs);Windows 先跑看看,失敗不擋
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

