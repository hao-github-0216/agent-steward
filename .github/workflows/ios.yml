name: iOS App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: main
      upload:
        description: Upload the exported App to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check signing secrets
        env:
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_API_KEY" = true ] || missing+=(APPLE_API_KEY)
          [ "$HAS_API_ISSUER" = true ] || missing+=(APPLE_API_ISSUER)
          [ "$HAS_API_KEY_P8" = true ] || missing+=(APPLE_API_KEY_P8)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing signing secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Select the latest Xcode
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PY'
          import glob
          import re
          from pathlib import Path

          candidates = glob.glob("/Applications/Xcode_*.app")
          if not candidates:
              raise SystemExit("No versioned Xcode installation found")
          print(max(candidates, key=lambda app: tuple(map(int, re.findall(r"\d+", Path(app).stem)))))
          PY
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios-native
        run: xcodegen generate
      - name: Select the latest available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-simulators.json"
          SIMULATOR_DESTINATION=$(python3 - <<'PY'
          import json
          import os
          import re

          with open(os.path.join(os.environ["RUNNER_TEMP"], "ios-simulators.json")) as source:
              devices = json.load(source)["devices"]
          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r"\.iOS-(\d+(?:-\d+)*)$", runtime)
              if not match:
                  continue
              version = tuple(map(int, match.group(1).split("-")))
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      model = tuple(map(int, re.findall(r"\d+", device["name"])))
                      candidates.append((version, model, device["name"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          version, _, name = max(candidates)
          print(f"platform=iOS Simulator,name={name},OS={'.'.join(map(str, version))}")
          PY
          )
          printf 'SIMULATOR_DESTINATION=%s\n' "$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"
      - name: Run iOS unit tests
        working-directory: ios-native
        run: |
          set -euo pipefail
          xcodebuild test -project Steward.xcodeproj -scheme Steward \
            -only-testing:StewardTests \
            -destination "$SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO
      - name: Set the build number
        run: |
          set -euo pipefail
          printf 'BUILD_NUMBER=%s\n' "$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - name: Prepare the App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require("fs"), path = require("path");
          if (!/^[A-Za-z0-9]+$/.test(process.env.APPLE_API_KEY)) throw new Error("Invalid API key ID format");
          const name = `AuthKey_${process.env.APPLE_API_KEY}.p8`;
          const temporaryKey = path.join(process.env.RUNNER_TEMP, "ios-private-keys", name);
          const uploadKey = path.join(process.env.HOME, ".appstoreconnect", "private_keys", name);
          for (const file of [temporaryKey, uploadKey]) {
            fs.mkdirSync(path.dirname(file), {recursive:true, mode:0o700});
            fs.writeFileSync(file, process.env.APPLE_API_KEY_P8, {mode:0o600});
            fs.chmodSync(file, 0o600);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `APPLE_API_KEY_PATH=${temporaryKey}\n`);
          NODE
      - name: Archive the iOS App
        working-directory: ios-native
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcodebuild archive -project Steward.xcodeproj -scheme Steward \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Steward.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Export the App Store IPA
        id: export
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Steward.xcarchive" \
            -exportOptionsPlist ios-native/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/export/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            printf '::error::Expected exactly one exported IPA.\n'
            exit 1
          fi
          xcrun altool --upload-app -f "${ipas[0]}" -t ios \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - name: Save the IPA and debug symbols
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Steward.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary API keys
        if: always()
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ios-private-keys"
          if [[ "$APPLE_API_KEY" =~ ^[A-Za-z0-9]+$ ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          fi
