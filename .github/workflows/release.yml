name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true
        type: string
      dry_run:
        description: Build artifacts without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency: release-${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG=$RELEASE_TAG
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git show-ref --verify --quiet "refs/tags/$TAG" || { echo "Tag not found: $TAG" >&2; exit 1; }
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Archive source
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="agent-steward-$TAG/" -o "dist/agent-steward-$TAG.tar.gz" "$TAG"
          git archive --format=zip --prefix="agent-steward-$TAG/" -o "dist/agent-steward-$TAG.zip" "$TAG"
      - name: Generate release installers
        run: node scripts/gen-install.mjs --release "$TAG" --dist dist
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @("dist/install.ps1", "dist/install-windows.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors; throw "PowerShell syntax errors in $file" }
            Write-Host "PASS: PowerShell syntax ($file)"
          }
      - name: Check installers and archive contents
        shell: bash
        run: |
          set -euo pipefail
          sh -n dist/install.sh
          echo "PASS: shell syntax"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const tag = process.env.TAG;
          const hash = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
          const shell = readFileSync("dist/install.sh", "utf8");
          const windowsBytes = readFileSync("dist/install-windows.ps1");
          const windows = windowsBytes.toString("utf8");
          const bootstrapBytes = readFileSync("dist/install.ps1");
          const bootstrap = bootstrapBytes.toString("utf8");
          assert.ok(bootstrapBytes.every((byte) => byte <= 0x7f));
          assert.ok(bootstrap.includes("\r\n"));
          assert.doesNotMatch(bootstrap, /(?<!\r)\n|\r(?!\n)/);
          console.log("PASS: install.ps1 is ASCII with CRLF throughout");
          assert.deepEqual([...windowsBytes.subarray(0, 3)], [0xef, 0xbb, 0xbf]);
          assert.ok(!windows.includes("\r"));
          console.log("PASS: install-windows.ps1 is UTF-8 with BOM and LF");
          assert.equal(shell.match(/^APP_PIN_VERSION='([^']*)'$/m)?.[1], tag);
          assert.equal(windows.match(/^\$AppPinVersion = '([^']*)'$/m)?.[1], tag);
          console.log("PASS: installers pin the release tag");
          for (const [text, pattern, asset] of [
            [shell, /^APP_PIN_SHA256='([a-f0-9]{64})'$/m, `dist/agent-steward-${tag}.tar.gz`],
            [windows, /^\$AppPinZipSha256 = '([a-f0-9]{64})'$/m, `dist/agent-steward-${tag}.zip`],
            [bootstrap, /^\t\$expectedSha256 = '([a-f0-9]{64})'\r?$/m, "dist/install-windows.ps1"],
          ]) {
            assert.equal(text.match(pattern)?.[1], hash(asset), asset);
            console.log(`PASS: pinned SHA-256 matches ${asset}`);
          }
          NODE
          T=$(mktemp -d)
          trap 'rm -rf "$T"' EXIT
          tar -xzf "dist/agent-steward-$TAG.tar.gz" -C "$T"
          test -f "$T/agent-steward-$TAG/src/main.ts"
          echo "PASS: archive contains src/main.ts"
          test -f "$T/agent-steward-$TAG/package.json"
          echo "PASS: archive contains package.json"
          test ! -e "$T/agent-steward-$TAG/ios-app"
          echo "PASS: archive excludes ios-app/"
          test ! -e "$T/agent-steward-$TAG/ios-native"
          echo "PASS: archive excludes ios-native/"
      - uses: actions/upload-artifact@v4
        with:
          name: release-core
          path: dist/
          if-no-files-found: error

  signing:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.signing.outputs.ready }}
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
      HAS_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
      HAS_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      - name: Require Mac and updater signing configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_CERT" = true ] || missing+=(APPLE_CERTIFICATE)
          [ "$HAS_CERT_PASSWORD" = true ] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [ "$HAS_API_ISSUER" = true ] || missing+=(APPLE_API_ISSUER)
          [ "$HAS_API_KEY" = true ] || missing+=(APPLE_API_KEY)
          [ "$HAS_API_KEY_P8" = true ] || missing+=(APPLE_API_KEY_P8)
          [ "$HAS_UPDATER_KEY" = true ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [ "$HAS_UPDATER_KEY_PASSWORD" = true ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing signing secrets: %s\n' "${missing[*]}"
            echo '::error::Every future release needs App updater artifacts or installed Apps cannot find updates. Configure all seven signing secrets before releasing.'
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  desktop:
    needs: [build, signing]
    if: needs.signing.outputs.ready == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  publish:
    needs: [build, signing, desktop]
    if: always() && needs.build.result == 'success' && needs.signing.result == 'success' && needs.desktop.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist/
          merge-multiple: true
      - name: Verify updater signatures and generate the update manifest
        shell: bash
        run: |
          set -euo pipefail
          MAC="agent-steward-desktop-$TAG-macos-universal.app.tar.gz"
          WIN="agent-steward-desktop-$TAG-windows-x64-setup.exe"
          PUBKEY=$(node -p 'JSON.parse(require("node:fs").readFileSync("desktop/src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey')
          node desktop/scripts/updater-artifacts.mjs verify --pubkey "$PUBKEY" --file "dist/$MAC" --sig "dist/$MAC.sig"
          node desktop/scripts/updater-artifacts.mjs verify --pubkey "$PUBKEY" --file "dist/$WIN" --sig "dist/$WIN.sig"
          NOTES=$(mktemp "$RUNNER_TEMP/release-notes.XXXXXX")
          trap 'rm -f "$NOTES"' EXIT
          printf 'See https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" > "$NOTES"
          node desktop/scripts/updater-artifacts.mjs manifest --version "${TAG#v}" --notes-file "$NOTES" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --mac "dist/$MAC" --win "dist/$WIN" --out dist/latest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const tag = process.env.TAG;
          const manifest = JSON.parse(readFileSync('dist/latest.json', 'utf8'));
          assert.equal(manifest.version, tag.replace(/^v/, ''));
          const assets = {
            'darwin-aarch64': `agent-steward-desktop-${tag}-macos-universal.app.tar.gz`,
            'darwin-x86_64': `agent-steward-desktop-${tag}-macos-universal.app.tar.gz`,
            'windows-x86_64': `agent-steward-desktop-${tag}-windows-x64-setup.exe`,
          };
          assert.deepEqual(Object.keys(manifest.platforms).sort(), Object.keys(assets).sort());
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/`;
          for (const [platform, asset] of Object.entries(assets)) {
            assert.equal(manifest.platforms[platform].url, base + asset);
            assert.ok(!manifest.platforms[platform].url.includes('/latest/'));
            assert.equal(manifest.platforms[platform].signature, readFileSync(`dist/${asset}.sig`, 'utf8'));
          }
          NODE
      - name: Check the exact release asset list
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync } from 'node:fs';
          const tag = process.env.TAG;
          const expected = [`agent-steward-${tag}.tar.gz`, `agent-steward-${tag}.zip`, 'install.sh', 'install.ps1', 'install-windows.ps1'];
          expected.push(
            `agent-steward-desktop-${tag}-macos-universal.dmg`,
            `agent-steward-desktop-${tag}-macos-universal.app.tar.gz`,
            `agent-steward-desktop-${tag}-macos-universal.app.tar.gz.sig`,
            `agent-steward-desktop-${tag}-windows-x64-setup.exe`,
            `agent-steward-desktop-${tag}-windows-x64-setup.exe.sig`,
            'latest.json',
          );
          const entries = readdirSync('dist', {withFileTypes:true});
          assert.ok(entries.every(entry => entry.isFile()), 'dist must contain only regular files');
          assert.deepEqual(entries.map(entry => entry.name).sort(), expected.sort(), 'Unexpected release assets');
          NODE
      - name: Generate SHA256SUMS
        run: cd dist && sha256sum agent-steward-* install.sh install.ps1 install-windows.ps1 latest.json > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    needs: [build, publish]
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os == 'macOS'
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 22.x
      - name: Install and uninstall the published release
        shell: bash
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          trap 'rm -rf "$T"' EXIT
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh"
          env -i HOME="$T" PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=en_US.UTF-8 sh -c 'curl --proto =https --tlsv1.2 -fsSL --retry 4 --retry-delay 10 --retry-all-errors "$0" | sh -s -- --yes --without=autostart,open' "$URL"
          test "$(cat "$T/.agent-steward/app/REVISION")" = "$TAG"
          test -f "$T/.agent-steward/install.json"
          env -i HOME="$T" PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=en_US.UTF-8 sh "$T/.agent-steward/app/uninstall.sh" --purge
      - name: Verify release provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --proto '=https' --tlsv1.2 -fsSL --retry 4 --retry-delay 10 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/agent-steward-$TAG.tar.gz" \
            -o "dist/agent-steward-$TAG.tar.gz"
          gh attestation verify "dist/agent-steward-$TAG.tar.gz" -R "$GITHUB_REPOSITORY"
      - name: Verify the published Mac desktop App and updater
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ASSET="agent-steward-desktop-$TAG-macos-universal.dmg"
          UPDATE="agent-steward-desktop-$TAG-macos-universal.app.tar.gz"
          T=$(mktemp -d "$RUNNER_TEMP/desktop-verify.XXXXXX")
          cleanup() { hdiutil detach "$T/mount" >/dev/null 2>&1 || true; rm -rf "$T"; }
          trap cleanup EXIT
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -p "$UPDATE" -p "$UPDATE.sig" -p latest.json -p SHA256SUMS -D "$T"
          (
            cd "$T"
            for FILE in "$ASSET" "$UPDATE" "$UPDATE.sig" latest.json; do
              awk -v name="$FILE" '$2 == name {print; found++} END {if (found != 1) exit 1}' SHA256SUMS > desktop.sha256
              shasum -a 256 -c desktop.sha256
            done
          )
          gh attestation verify "$T/$ASSET" -R "$GITHUB_REPOSITORY"
          gh attestation verify "$T/$UPDATE" -R "$GITHUB_REPOSITORY"
          gh attestation verify "$T/latest.json" -R "$GITHUB_REPOSITORY"
          PUBKEY=$(node -p 'JSON.parse(require("node:fs").readFileSync("desktop/src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey')
          node desktop/scripts/updater-artifacts.mjs verify --pubkey "$PUBKEY" --file "$T/$UPDATE" --sig "$T/$UPDATE.sig"
          VERIFY_DIR="$T" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = process.env.VERIFY_DIR;
          const tag = process.env.TAG;
          const asset = `agent-steward-desktop-${tag}-macos-universal.app.tar.gz`;
          const manifest = JSON.parse(readFileSync(join(dir, 'latest.json'), 'utf8'));
          const signature = readFileSync(join(dir, `${asset}.sig`), 'utf8');
          assert.equal(manifest.version, tag.replace(/^v/, ''));
          for (const platform of ['darwin-aarch64', 'darwin-x86_64']) {
            assert.equal(manifest.platforms[platform].signature, signature);
            assert.equal(manifest.platforms[platform].url, `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${asset}`);
          }
          NODE
          mkdir "$T/updater"
          tar -xzf "$T/$UPDATE" -C "$T/updater"
          codesign --verify --deep --strict "$T/updater/Agent Steward.app"
          spctl -a -vv -t exec "$T/updater/Agent Steward.app"
          xcrun stapler validate "$T/updater/Agent Steward.app"
          mkdir "$T/mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$T/mount" "$T/$ASSET"
          codesign --verify --deep --strict "$T/mount/Agent Steward.app"
          spctl -a -vv -t exec "$T/mount/Agent Steward.app"
          xcrun stapler validate "$T/$ASSET"
          hdiutil detach "$T/mount"

  verify-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    needs: [build, publish]
    permissions:
      contents: read
      attestations: read
    runs-on: windows-latest
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      STEWARD_YES: "1"
      STEWARD_NO_SERVICE: "1"
      STEWARD_NO_OPEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install and uninstall with Windows PowerShell 5.1
        shell: powershell
        run: |
          $global:LASTEXITCODE = 0
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/install.ps1" | iex
          if ($LASTEXITCODE -ne 0) { throw "Installation failed: $LASTEXITCODE" }
          $revision = (Get-Content "$HOME\.agent-steward\app\REVISION" -Raw -Encoding UTF8).Trim()
          if ($revision -cne $env:TAG) { throw "Installed revision $revision does not match $env:TAG" }
          if (-not (Test-Path "$HOME\.agent-steward\install.json" -PathType Leaf)) { throw "Missing installation receipt" }
          & "$HOME\.agent-steward\app\uninstall.ps1" -Purge
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed: $LASTEXITCODE" }
      - name: Verify the published Windows desktop installer and updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "agent-steward-desktop-$env:TAG-windows-x64-setup.exe"
          $temp = Join-Path $env:RUNNER_TEMP ('desktop-verify-' + [guid]::NewGuid())
          New-Item -ItemType Directory $temp | Out-Null
          try {
            gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p $asset -p "$asset.sig" -p latest.json -p SHA256SUMS -D $temp
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download release assets' }
            foreach ($name in @($asset, "$asset.sig", 'latest.json')) {
              $lines = @(Get-Content (Join-Path $temp 'SHA256SUMS') | Where-Object { $_ -match ('^[a-f0-9]{64}\s+\*?' + [regex]::Escape($name) + '$') })
              if ($lines.Count -ne 1) { throw "Expected exactly one checksum for $name" }
              $expected = ($lines[0] -split '\s+')[0]
              if ((Get-FileHash (Join-Path $temp $name) -Algorithm SHA256).Hash -ine $expected) { throw "Checksum mismatch for $name" }
            }
            $file = Join-Path $temp $asset
            gh attestation verify $file -R $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Desktop installer attestation verification failed' }
            $pubkey = node -p 'JSON.parse(require("node:fs").readFileSync("desktop/src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read updater public key' }
            node desktop/scripts/updater-artifacts.mjs verify --pubkey $pubkey --file $file --sig "$file.sig"
            if ($LASTEXITCODE -ne 0) { throw 'Desktop installer updater signature verification failed' }
            $manifest = Get-Content (Join-Path $temp 'latest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
            $signature = Get-Content "$file.sig" -Raw -Encoding UTF8
            if ($manifest.version -cne ($env:TAG -creplace '^v', '')) { throw 'Updater manifest version mismatch' }
            if ($manifest.platforms.'windows-x86_64'.signature -cne $signature) { throw 'Updater manifest Windows signature mismatch' }
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$asset"
            if ($manifest.platforms.'windows-x86_64'.url -cne $url) { throw 'Updater manifest Windows URL mismatch' }
          } finally { Remove-Item $temp -Recurse -Force }
