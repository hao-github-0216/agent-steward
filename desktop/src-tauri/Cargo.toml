[package]
name = "agent-steward-desktop"
version = "0.2.0"
description = "Agent Steward menu bar and system tray app"
edition = "2021"
publish = false
license = "MIT"

[profile.release]
strip = "none"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"
