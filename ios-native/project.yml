# 專案管家 iPhone 原生版(SwiftUI)。Xcode 專案由 xcodegen 產生:`xcodegen generate`
name: Steward
options:
  bundleIdPrefix: io.github.haogithub0216
  developmentLanguage: zh-Hant
  knownRegions: [zh-Hant, en, Base]
  deploymentTarget:
    iOS: "17.0"
packages:
  # 原生排數學式(LaTeX → 圖),問管家的回答用
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
settings:
  base:
    DEVELOPMENT_TEAM: N8XLCRL5GL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Steward:
    type: application
    platform: iOS
    sources:
      - path: Steward
        excludes: [PrivacyInfo.xcprivacy, "**/*.lproj", Localizable.xcstrings, InfoPlist.xcstrings]
      - path: Steward/Localizable.xcstrings
        buildPhase: resources
      - path: Steward/InfoPlist.xcstrings
        buildPhase: resources
      - path: Steward/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/WatchProtocol.swift
    dependencies:
      - package: SwiftMath
      - target: StewardNotify
        embed: true
      - target: StewardWatch
        embed: true
    settings:
      base:
        # 跟 Tauri 版(io.github.haogithub0216.agentsteward)分開,兩個可以同時裝在手機上比較
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haogithub0216.agentsteward.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Steward/Steward.entitlements
    scheme:
      testTargets:
        - StewardTests
        - StewardUITests
    info:
      path: Steward/Info.plist
      properties:
        CFBundleDisplayName: 專案管家
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        StewardKeychainGroup: $(AppIdentifierPrefix)io.github.haogithub0216.agentsteward.shared
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad:四個方向都可以(分割畫面、多工需要)
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 連到你電腦上的專案管家
        NSCameraUsageDescription: 拍照附在問管家的問題裡
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        NSUserActivityTypes: [io.github.haogithub0216.agentsteward.native.open]
        # 程式碼頁的分頁拖曳(只在這個 app 裡面用)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.haogithub0216.agentsteward.native.tab
            UTTypeDescription: 程式碼頁分頁
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        CFBundleURLTypes:
          - CFBundleURLName: io.github.haogithub0216.agentsteward.native
            CFBundleURLSchemes: [agentsteward]
  StewardNotify:
    type: app-extension
    platform: iOS
    sources:
      - StewardNotify
      - Steward/PushCrypto.swift
      # 推播備用文字與 App 分開編譯，沿用現有的兩份翻譯。
      - path: Steward/en.lproj
        buildPhase: resources
      - path: Steward/zh-Hant.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haogithub0216.agentsteward.native.notify
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: StewardNotify/StewardNotify.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: StewardNotify/Info.plist
      properties:
        CFBundleDisplayName: StewardNotify
        # 版本號跟主 App 一致(Info.plist 由 xcodegen 產生,直接改 plist 會被蓋掉)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        StewardKeychainGroup: $(AppIdentifierPrefix)io.github.haogithub0216.agentsteward.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  StewardWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StewardWatch
        excludes: [Localizable.xcstrings, InfoPlist.xcstrings]
      - path: Shared/WatchProtocol.swift
      - path: StewardWatch/Localizable.xcstrings
        buildPhase: resources
      - path: StewardWatch/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - target: StewardWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haogithub0216.agentsteward.native.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: StewardWatch/StewardWatch.entitlements
        SKIP_INSTALL: YES
    scheme:
      testTargets:
        - StewardWatchUITests
    info:
      path: StewardWatch/Info.plist
      properties:
        CFBundleDisplayName: 專案管家
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.github.haogithub0216.agentsteward.native
        WKRunsIndependentlyOfCompanionApp: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.haogithub0216.agentsteward.native.watchkitapp
            CFBundleURLSchemes: [agentsteward-watch]
  StewardWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - StewardWatchWidgets
      - path: Shared/WatchProtocol.swift
      - path: StewardWatch/Localizable.xcstrings
        buildPhase: resources
      - path: StewardWatch/InfoPlist.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haogithub0216.agentsteward.native.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: StewardWatchWidgets/StewardWatchWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: StewardWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: 專案管家
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  StewardWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - StewardWatchUITests
    dependencies:
      - target: StewardWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haogithub0216.agentsteward.native.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StewardWatch
  StewardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StewardTests
      - Steward/PushCrypto.swift
      - path: ../relay/test/vectors.json
        buildPhase: resources
    dependencies:
      - target: Steward
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haogithub0216.agentsteward.native.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Steward.app/Steward"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # 模擬器手勢測試(見 StewardUITests/GestureTests.swift)
  StewardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StewardUITests
    dependencies:
      - target: Steward
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haogithub0216.agentsteward.native.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Steward
