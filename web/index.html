<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>專案管家</title>
<style>
:root {
	--bg: #f6f5f2; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280; --line: #e3e1dc;
	--accent: #2f6fdf; --ok: #1f8a4c; --warn: #b7791f; --bad: #c2410c; --chip: #eef2f9;
	--col: #efede8; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
	:root { --bg: #15171a; --panel: #1d2024; --ink: #e6e6e6; --muted: #9aa1aa; --line: #2c3036;
		--accent: #6b9cff; --ok: #4cc38a; --warn: #e0b04f; --bad: #f08a5d; --chip: #252a33; --col: #191c20;
		--shadow: 0 1px 2px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; height: 50px; box-sizing: border-box; padding-top: 0; padding-bottom: 0; }
header h1 { font-size: 16px; margin: 0; }
.titlebtn { display: flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink); padding: 6px 8px; margin-left: -8px; border-radius: 8px; cursor: pointer; font: inherit; }
.titlebtn:hover { background: var(--chip); }
.titlebtn .chev { color: var(--muted); font-size: 12px; }
.gear { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 4px 8px; border-radius: 8px; cursor: pointer; flex: 0 0 auto; }
.gear:hover { background: var(--chip); color: var(--ink); }
@media (max-width: 800px) { .gear { margin-left: auto; } }
/* ---------- 登入畫面 ---------- */
.loginwrap { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.loginbox { width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,.15); }
.loginbox h2 { margin: 0; font-size: 18px; }
.loginbox input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.loginbox button { font: inherit; padding: 10px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
.loginerr { color: var(--bad); font-size: 13px; min-height: 1em; }
.pwbanner { position: fixed; left: 16px; bottom: 16px; z-index: 58; max-width: min(380px, calc(100vw - 100px)); background: var(--warn); color: #fff; font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
/* ---------- 設定 ---------- */
.modal.setmodal .box { width: min(860px, 100%); height: min(680px, calc(var(--appH, 100dvh) - 40px)); }
.modal.setmodal .mbody { flex-direction: row; gap: 0; padding: 0; flex: 1; min-height: 0; }
.wz-intro { background: var(--bg2, rgba(127,127,127,.12)); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.5; }
.login-box { border: 1px solid var(--line, rgba(127,127,127,.3)); border-radius: 8px; padding: 10px 12px; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
.login-box[hidden] { display: none; }
.login-code { font: 600 26px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 3px; padding: 6px 0; user-select: all; }
.login-box .row { display: flex; gap: 6px; align-items: center; }
.login-box .row input { flex: 1; min-width: 0; }
.login-box .row button { flex: 0 0 auto; }
.upd-log, .upd-notes, .upd-cmd { background: var(--bg2, rgba(127,127,127,.12)); padding: 8px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; margin: 6px 0; }
.set-tabs { flex: 0 0 150px; border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.set-tabs button { text-align: left; border: 0; background: none; color: var(--ink); font: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.set-tabs button.on { background: var(--accent); color: #fff; }
.set-pane { flex: 1; min-width: 0; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.set-pane h4 { margin: 4px 0 0; font-size: 13px; }
.set-pane .hint { color: var(--muted); font-size: 12px; }
.set-pane textarea { font: 13px/1.5 Menlo, monospace; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 70px; resize: vertical; }
.set-pane .row { display: flex; gap: 10px; flex-wrap: wrap; }
.set-pane .row > * { flex: 1 1 200px; }
.set-pane .radios { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.set-pane .sub { border-left: 3px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; gap: 10px; }
.set-pane .sub[hidden] { display: none; }
.set-note { color: var(--warn); font-size: 12px; }
.prov { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.prov-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prov-test { font-size: 12.5px; }
.prov .chip.on { background: var(--ok); color: #fff; }
.prov-test .ok { color: var(--ok); font-weight: 600; }
.prov-test .bad { color: var(--bad); }
.route { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--line); }
.route select { width: 100%; font: inherit; font-size: 13px; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
@media (max-width: 800px) { .route { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 800px) {
	.modal.setmodal { padding: 0; }
	.modal.setmodal .box { height: calc(var(--appH, 100dvh)); max-height: none; border-radius: 0; }
	.modal.setmodal .mbody { flex-direction: column; }
	.set-tabs { flex: 0 0 auto; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
	.set-tabs button { white-space: nowrap; }
}
header .status { margin-left: auto; color: var(--muted); font-size: 12px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: middle; }
.dot.off { background: var(--bad); }
main { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: calc(100vh - 50px); height: calc(var(--appH, 100dvh) - 50px); min-height: 0; }
nav { border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; overscroll-behavior: contain; position: sticky; top: 50px; height: calc(100vh - 50px); height: calc(var(--appH, 100dvh) - 50px); align-self: start; }
nav h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 14px 4px 6px; letter-spacing: .03em; }
.projrow { display: flex; align-items: center; border-radius: 8px; }
.projrow:hover { background: var(--chip); }
.projrow.sel { background: var(--accent); color: #fff; }
.projrow .proj { flex: 1; min-width: 0; }
.projrow.sel .proj, .projrow:hover .proj { background: none; }
.projrow.sel .proj small { color: rgba(255,255,255,.8); }
.pmore { flex: 0 0 auto; border: 0; background: none; color: inherit; font-size: 18px; line-height: 1; padding: 6px 10px; border-radius: 6px; cursor: pointer; opacity: 0; }
.projrow:hover .pmore, .projrow.sel .pmore, .pmore:focus-visible { opacity: .85; }
.pmore:hover { background: rgba(127,127,127,.18); }
@media (hover: none) { .pmore { opacity: .7; } }
.proj { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; font: inherit; }
.proj:hover { background: var(--chip); }
.proj.sel { background: var(--accent); color: #fff; }
.proj small { display: block; color: var(--muted); font-size: 11px; }
.proj.sel small { color: rgba(255,255,255,.8); }
.badge { float: right; font-size: 11px; background: var(--warn); color: #fff; border-radius: 9px; padding: 0 6px; }
.pending { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 12px; }
.pending b { display: block; word-break: break-all; }
.pending .row { display: flex; gap: 6px; margin-top: 6px; }
button.small { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.small.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
section.content > .boardwrap, section.content > .lower { flex-shrink: 0; }
section.content { padding: 16px; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
.card-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
.brief h3 { margin: 0 0 4px; font-size: 15px; }
.brief .path { color: var(--muted); font-size: 12px; word-break: break-all; }
.brief .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 10px; }
.brief h4 { font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
.brief ul { margin: 0; padding-left: 18px; }
.brief p { margin: 4px 0; white-space: pre-wrap; }
.toggles { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; overflow-x: hidden; min-width: 0; }
.bdots { display: none; }
/* 收合的欄:變成窄條,標題直排 */
.col.collapsed { padding: 8px 2px; min-height: 0; cursor: pointer; }
.col.collapsed h4 { writing-mode: vertical-rl; flex-direction: row; gap: 8px; margin: 2px auto; }
.col.collapsed .cards { display: none; }
.col h4 { cursor: pointer; user-select: none; }
.col h4 .fold { opacity: .5; font-weight: 400; }
.col h4:hover .fold { opacity: 1; }
.col:not(:has(.kcard)) { min-height: 60px; }
.col { background: var(--col); border-radius: 10px; padding: 8px; min-height: 140px; border: 2px solid transparent; }
.col.over { border-color: var(--accent); }
.col h4 { margin: 2px 4px 8px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
/* 卡片只佔一行:標題 + 右邊小標記;點一下開資訊卡,按住拖曳換欄 */
.kcard { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; cursor: pointer; touch-action: pan-y; user-select: none; box-shadow: var(--shadow); }
.kcard:hover { border-color: var(--accent); }
.kcard.dragging { opacity: .4; }
.kcard .t { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kcard .tags { flex: 0 0 auto; display: flex; gap: 5px; align-items: center; font-size: 11px; color: var(--muted); }
.kcard .dn { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.kcard .pn { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col .more { width: 100%; margin-top: 2px; }
/* 看板區塊最高約佔視窗 45%,每欄自己捲 */
.boardwrap { display: flex; flex-direction: column; min-height: 0; min-width: 0; max-height: 45vh; max-height: 45dvh; }
.board { flex: 1 1 auto; min-height: 0; align-items: stretch; }
.col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.col .cards { flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; }
/* 資訊卡 */
.modal.cardpop .box { width: min(560px, 100%); }
.cardpop .cmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.cardpop .cnote { color: var(--warn); font-size: 13px; white-space: pre-wrap; }
.cardpop h4 { margin: 0; font-size: 12px; color: var(--muted); }
.cardpop .ctext { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 Menlo, monospace; background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 0; max-height: 40vh; overflow: auto; }
.cardpop .mfoot .sp { flex: 1; }
@media (max-width: 800px) {
	.modal.cardpop { place-items: end stretch; padding: 0; }
	.modal.cardpop .box { width: 100%; border-radius: 14px 14px 0 0; max-height: 85vh; max-height: 85dvh; }
}
.ghost { position: fixed; pointer-events: none; z-index: 50; opacity: .9; transform: rotate(2deg); width: 220px; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.chat .log { max-height: 280px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.msg { padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; max-width: 85%; }
.msg.me { align-self: flex-end; background: var(--accent); color: #fff; }
.msg.bot { align-self: flex-start; background: var(--chip); }
.chat form { display: flex; gap: 8px; }
.chat textarea { flex: 1; resize: vertical; min-height: 40px; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.empty { color: var(--muted); font-size: 13px; }
/* 專案清單:寬螢幕可以收起,窄螢幕改成滑出 */
body.nav-collapsed main { grid-template-columns: minmax(0, 1fr); }
body.nav-collapsed nav { display: none; }
/* 程式碼/終端機模式本身就是滿版,整頁不捲 */
/* 整頁永遠不捲:標題列、專案欄固定,右邊內容區自己捲(小視窗也一樣) */
html, body { height: 100%; overflow: hidden; }
/* ---------- 看板頁:夠寬又夠高才固定在視窗內,各區塊自己捲;其他尺寸整頁可以捲 ---------- */
@media (min-width: 1100px) and (min-height: 680px) {
	html, body { height: 100%; overflow: hidden; }
	main { height: calc(100vh - 50px); height: calc(var(--appH, 100dvh) - 50px); min-height: 0; }
	nav { min-height: 0; }
	section.content { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; min-height: 0; }
	.lower { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-height: 0; min-width: 0; }
	.lower .brief { overflow-y: auto; min-height: 0; }
	.lower .chat { display: flex; flex-direction: column; min-height: 0; }
	.chat .log { flex: 1; min-height: 0; max-height: none; }
}
@media (min-width: 1100px) and (min-height: 680px) {
	/* 收起看板或對話時,其他區塊吃掉空間 */
	body.board-collapsed section.content { grid-template-rows: auto minmax(0, 1fr); }
}
.lower { display: grid; gap: 16px; }
body.board-collapsed .board { display: none; }
.viewtoggles { display: flex; gap: 6px; margin-left: auto; }
/* 1100 以下:專案清單改成從左邊滑出;簡報和對話上下排 */
@media (max-width: 1099px) {
	main { grid-template-columns: minmax(0, 1fr); }
	nav { display: block; position: fixed; z-index: 30; top: 50px; bottom: 0; left: 0; width: min(300px, 85vw); background: var(--panel); border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(0,0,0,.18); transform: translateX(-105%); transition: transform .18s ease; }
	nav.open { transform: none; }
	body.nav-collapsed nav { display: block; }
	.lower { grid-template-columns: minmax(0, 1fr); }
	.lower .chat .log { max-height: 50vh; }
}
/* ---------- 看板/終端機切換 ---------- */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 4px 14px; border: 0; background: var(--panel); color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.termctl { display: none; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
body.term .termctl { display: inline-flex; }
body.term main, body.code main { display: contents; }
body.term main > section.content, body.code main > section.content { display: none; }
body.term nav, body.code nav { display: block; position: fixed; z-index: 40; top: 50px; bottom: 0; left: 0; width: min(300px, 85vw); height: calc(100vh - 50px); height: calc(var(--appH, 100dvh) - 50px); background: var(--panel); border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(0,0,0,.18); transform: translateX(-105%); transition: transform .18s ease; }
body.term nav.open, body.code nav.open { transform: none; }
/* 寬螢幕:跟看板頁的專案欄一樣寬 */
@media (min-width: 1100px) { body.term nav, body.code nav { width: 260px; } }
#termView { display: flex; height: calc(100vh - 50px); height: calc(var(--appH, 100dvh) - 50px); background: #1d2021; }
#termView[hidden] { display: none; }
.termwrap { position: relative; flex: 1; min-width: 0; }
#term { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #1d2021; }
.termhint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #a89984; pointer-events: none; }
.termhint[hidden] { display: none; }
.hint { color: var(--muted); font-size: 12px; }
/* ---------- 程式碼模式:活動列 | 側欄(檔案/Git)| 編輯器 | 管家側欄 ---------- */
body.code .termctl { display: inline-flex; }
body.code #fontDown, body.code #fontUp, body.code #fontSize { display: none; }
#codeView { display: flex; height: calc(100vh - 50px); height: calc(var(--appH, 100dvh) - 50px); background: var(--panel); }
#codeView[hidden] { display: none; }
.cv-act { flex: 0 0 52px; display: flex; flex-direction: column; gap: 4px; padding: 8px 4px; border-right: 1px solid var(--line); background: var(--bg); }
.cv-act button { position: relative; font: inherit; font-size: 11px; padding: 8px 2px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
.cv-act button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
.cv-act .badge { position: absolute; top: 2px; right: 2px; float: none; font-size: 10px; padding: 0 5px; background: var(--accent); }
.cv-side { flex: 0 0 290px; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.cv-proj { padding: 8px; border-bottom: 1px solid var(--line); }
.cv-projname { width: 100%; display: flex; align-items: center; gap: 6px; font-weight: 600; padding: 6px 8px; color: var(--ink); }
.cv-projname .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cv-projname .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.projrow .unsaved { color: var(--warn); margin-right: 4px; }
.cv-pane { flex: 1; min-height: 0; overflow: auto; font-size: 13px; }
.cv-pane[hidden] { display: none; }
.cv-tools { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.cv-tools .t { flex: 1; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.cv-tools button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
.tree-row { display: flex; align-items: center; gap: 4px; padding: 2px 8px; cursor: pointer; white-space: nowrap; user-select: none; }
.tree-row:hover { background: var(--chip); }
.tree-row.sel { background: var(--accent); color: #fff; }
.tree-row .tw { width: 12px; flex: 0 0 12px; color: var(--muted); font-size: 10px; text-align: center; }
.tree-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tree-row.ign { opacity: .5; }
.tree-row .g { font: 600 11px Menlo, monospace; width: 14px; text-align: center; }
.g-M { color: var(--warn); } .g-U, .g-A { color: var(--ok); } .g-D { color: var(--bad); } .g-dot { color: var(--warn); }
.tree-row .more { opacity: 0; border: 0; background: none; color: inherit; cursor: pointer; padding: 0 4px; }
.tree-row:hover .more, .tree-row.sel .more { opacity: .8; }
.git-sec { border-bottom: 1px solid var(--line); }
.git-sec > .h { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; cursor: pointer; }
.git-sec > .h .acts { margin-left: auto; display: flex; gap: 4px; }
.git-row { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 14px; cursor: pointer; }
.git-row:hover { background: var(--chip); }
.git-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.git-row .dir { color: var(--muted); font-size: 11px; margin-left: 4px; }
.git-row .ra { display: none; gap: 2px; }
.git-row:hover .ra { display: flex; }
.git-row .ra button, .git-sec .acts button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 5px; font-size: 11px; padding: 0 5px; cursor: pointer; }

kbd { font: 12px Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
/* 管家側欄:預設從右邊浮出,不擠終端機;超寬螢幕才並排 */
#drawer { position: absolute; top: 50px; right: 0; bottom: 0; width: 360px; max-width: 92vw; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.25); transform: translateX(100%); transition: transform .18s ease; overflow: auto; z-index: 20; padding: 12px 14px; }
body.drawer #drawer { transform: none; }
@media (min-width: 1800px) {
	#drawer { position: static; transform: none; box-shadow: none; display: none; flex: 0 0 360px; }
	body.drawer #drawer { display: block; }
}
.dhead { display: flex; gap: 8px; margin-bottom: 10px; }
.dhead .dt { flex: 1; min-width: 0; }
.dhead .dt b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dhead .dt small { color: var(--muted); font-size: 12px; }
#dBody h4 { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
#dBody p, #dBody li { font-size: 13px; }
#dBody ul { margin: 0; padding-left: 18px; }
#dBody .kcard { touch-action: auto; }
@media (max-width: 440px) {
	body.term #fontDown, body.term #fontUp { display: none; } /* 窄手機:讓出空間給標題和頁籤 */
}
@media (max-width: 800px) {
	.seg button { padding: 4px 10px; }
	#drawer { top: auto; left: 0; width: auto; max-width: none; height: 60vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; transform: translateY(100%); }
	body.term .status, body.term #fontSize { display: none; }
	.seg { flex-shrink: 0; }
	body.term header h1 { font-size: 13px; }
	header { gap: 8px; }
}
.tool { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
form.tool { flex-direction: row; }
.tool input { flex: 1; min-width: 0; font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.subdir { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--line); }
.subdir span:first-child { word-break: break-all; }
.split > button { align-self: flex-start; }
.note-err { color: var(--bad); font-size: 12px; }
@media (max-width: 800px) {
	.board { grid-auto-columns: 78vw; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; }
	.board > .col { scroll-snap-align: start; }
	.bdots { display: flex; justify-content: center; gap: 8px; margin: 0 0 8px; }
	.bdots button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: 0; background: var(--line); }
	.bdots button.on { background: var(--accent); width: 18px; border-radius: 4px; }
}
</style>
</head>
<body>
<header>
	<button class="titlebtn" id="menu" title="開合專案欄"><h1>專案管家</h1><span class="chev" id="menuChev">◂</span></button>
	<div class="seg" role="tablist">
		<button id="modeBoard" class="on" role="tab">看板</button>
		<button id="modeCode" role="tab">程式碼</button>
		<button id="modeTerm" role="tab">終端機</button>
	</div>
	<div class="termctl" id="termctl">
		<button class="small" id="fontDown" title="字體縮小">A−</button>
		<span id="fontSize">15</span>
		<button class="small" id="fontUp" title="字體放大">A+</button>
		<button class="small" id="drawerBtn" title="管家側欄">管家 ▸</button>
	</div>
	<span class="status" id="status"><span class="dot"></span>連線中…</span>
	<button class="gear" id="gearBtn" type="button" title="設定" aria-label="設定">⚙</button>
</header>
<section id="termView" hidden>
	<div class="termwrap"><iframe id="term" title="herdr 終端機"></iframe><div class="termhint" id="termHint">連線到 herdr…</div></div>
	<aside id="drawer" class="sfade">
		<div class="dhead"><div class="dt" id="dTitle"></div><button class="small" id="drawerClose">收起</button></div>
		<div id="dBody"></div>
	</aside>
</section>
<section id="codeView" hidden>
	<div class="cv-act">
		<button id="cvFilesBtn" class="on" title="檔案">檔案</button>
		<button id="cvGitBtn" title="版本控制">Git<span class="badge" id="cvGitCount" hidden></span></button>
	</div>
	<div class="cv-side">
		<div class="cv-proj"><div id="cvProject" class="cv-projname"></div></div>
		<div id="cvFiles" class="cv-pane sfade"></div>
		<div id="cvGit" class="cv-pane sfade" hidden></div>
	</div>
	<div class="cv-sash-v" id="cvSideSash" title="拖拉調整側欄寬度"></div>
	<div class="cv-main" id="cvGroups"></div>
</section>
<main id="boardView">
	<nav id="nav" class="sfade"></nav>
	<section class="content sfade">
		<div class="boardwrap">
			<div class="toggles" style="margin:0 0 8px">
				<label><input type="checkbox" id="allCards"> 顯示所有專案的工作卡</label>
				<span title="提案→已核准:派工;卡住/完成→已核准:重新派工(附上次結果);進行中/卡住→完成:手動標記;任何→提案:退回;「進行中」只能由派工產生">拖到「已核准」= 派工或重新派工 · 拖回「提案」= 退回 · 游標停在這裡看完整規則</span>
				<span class="viewtoggles"><button class="small" id="toggleBoard">收起看板</button></span>
			</div>
			<div class="bdots" id="bdots"></div>
			<div class="board" id="board"></div>
		</div>
		<div class="lower">
			<div class="card-panel brief sfade" id="brief"></div>
		</div>
	</section>
</main>
<!-- 問管家:浮動球(三個頁面共用,可拖到四個角落) -->
<div id="ballWrap" data-corner="br">
	<div id="ballPanel" hidden role="dialog" aria-label="問管家">
		<div class="bp-head"><b id="bpTitle">問管家</b><button class="small" id="bpClear" title="清除這個專案畫面上的問答紀錄(管家記得的專案進度不受影響)">清除紀錄</button><button class="small" id="bpClose">關閉</button></div>
		<div class="bp-log sfade" id="bpLog"></div>
		<div class="bp-sugg" id="bpSugg" hidden></div>
		<div class="bp-quote" id="bpQuote" hidden></div>
		<form id="bpForm"><textarea id="bpInput" placeholder="問管家這個專案的事…(⌘/Ctrl+Enter 送出)"></textarea><button class="small primary">送出</button></form>
	</div>
	<button id="stewardBall" type="button" title="問管家(可以拖到畫面四個角落)" aria-label="問管家"><svg class="cat" viewBox="0 0 64 64" aria-hidden="true">
		<path d="M11 27 L13 6 L28 17 Z" fill="#f6a04d"/><path d="M53 27 L51 6 L36 17 Z" fill="#f6a04d"/>
		<path d="M15 22 L16 11 L24 17 Z" fill="#ffb3c1"/><path d="M49 22 L48 11 L40 17 Z" fill="#ffb3c1"/>
		<ellipse cx="32" cy="37" rx="24" ry="21" fill="#f6a04d"/>
		<path d="M26 17 Q32 22 38 17 Q35 25 32 26 Q29 25 26 17 Z" fill="#e08a36"/>
		<ellipse cx="32" cy="44" rx="15" ry="11" fill="#fff6ea"/>
		<g class="cat-eyes"><ellipse cx="22.5" cy="35" rx="4.2" ry="5" fill="#3b2a20"/><ellipse cx="41.5" cy="35" rx="4.2" ry="5" fill="#3b2a20"/>
		<circle cx="24" cy="33" r="1.6" fill="#fff"/><circle cx="43" cy="33" r="1.6" fill="#fff"/></g>
		<ellipse cx="15.5" cy="43" rx="3.6" ry="2.2" fill="#ff8fa3" opacity=".55"/><ellipse cx="48.5" cy="43" rx="3.6" ry="2.2" fill="#ff8fa3" opacity=".55"/>
		<path d="M30 41.5 h4 l-2 2.4 z" fill="#ff7b93" stroke="#ff7b93" stroke-linejoin="round"/>
		<path d="M27.5 45.5 q2.2 2.6 4.5 0 q2.3 2.6 4.5 0" fill="none" stroke="#3b2a20" stroke-width="1.5" stroke-linecap="round"/>
		<g stroke="#3b2a20" stroke-width="1" stroke-linecap="round" opacity=".55"><path d="M4 41 L16 42.5"/><path d="M5 47 L16 45.5"/><path d="M60 41 L48 42.5"/><path d="M59 47 L48 45.5"/></g>
	</svg></button>
</div>
<div class="modal" id="createDlg" hidden>
	<div class="box" role="dialog" aria-labelledby="createTitle">
		<div class="mhead"><h3 id="createTitle">建立專案</h3><button class="small" data-close="createDlg">關閉</button></div>
		<div class="mbody">
			<div class="choice"><button class="small" id="fsUp">↑ 上一層</button><span class="crumb" id="fsPath"></span></div>
			<div class="dirlist" id="fsList"></div>
			<div class="choice"><button class="small primary" id="fsPick">選這個資料夾</button><span class="hint" id="fsHere"></span></div>
			<div class="choice">
				<span class="hint">或在這裡新建:</span>
				<input type="text" id="newFolder" placeholder="新資料夾名稱">
				<label><input type="checkbox" id="newGit"> 同時建立 git repo</label>
				<button class="small" id="fsNew">新建</button>
			</div>
			<div id="createForm" hidden>
				<div class="msgbox" id="pickedBox"></div>
				<label class="field">專案名稱(也是 herdr space 的名稱)<input type="text" id="spaceName"></label>
				<label class="field">順便啟動 agent
					<select id="startAgent"><option value="none">不啟動</option><option value="pi">pi</option><option value="claude">Claude Code</option><option value="codex">Codex</option></select>
				</label>
			</div>
			<div class="msgbox" id="createMsg" hidden></div>
		</div>
		<div class="mfoot"><button class="small primary" id="createGo" disabled>建立</button></div>
	</div>
</div>
<div class="modal" id="tidyDlg" hidden>
	<div class="box" role="dialog" aria-labelledby="tidyTitle">
		<div class="mhead"><h3 id="tidyTitle">整理 spaces(一個專案一個 space)</h3><button class="small" data-close="tidyDlg">關閉</button></div>
		<div class="mbody"><div class="hint">勾選要執行的項目。搬窗格時裡面的程式不會中斷;管家不會關閉任何 space 或窗格。</div><div id="tidyList"><div class="empty">計算中…</div></div></div>
		<div class="mfoot"><span class="hint" id="tidyNote"></span><button class="small primary" id="tidyGo" disabled>執行勾選的項目</button></div>
	</div>
</div>
<script>
// ---------- 登入:/api 回 401/403 時顯示登入畫面 ----------
{
	const realFetch = window.fetch.bind(window);
	window.fetch = async (input, init) => {
		const r = await realFetch(input, init);
		const u = typeof input === "string" ? input : input?.url ?? "";
		if ((r.status === 401 || r.status === 403) && /^\/api\//.test(u) && !u.startsWith("/api/auth/")) {
			r.clone().json().then((d) => { if (d && "login" in d) showLogin(d); }).catch(() => {});
		}
		return r;
	};
}
let loginShown = false;
function showLogin(d = {}) {
	if (loginShown) return;
	loginShown = true;
	const w = document.createElement("div");
	w.className = "loginwrap";
	w.innerHTML = d.login === false
		? `<div class="loginbox"><h2>專案管家</h2><p>${(d.error || "還沒設定管理密碼").replace(/[&<>]/g, "")}</p></div>`
		: `<form class="loginbox"><h2>專案管家</h2><p class="hint">請輸入管理密碼</p><input type="password" name="pw" autocomplete="current-password" autofocus placeholder="管理密碼"><button class="primary" type="submit">登入</button><div class="loginerr"></div></form>`;
	document.body.appendChild(w);
	w.querySelector("form")?.addEventListener("submit", async (e) => {
		e.preventDefault();
		const pw = w.querySelector("input").value;
		const r = await fetch("/api/auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: pw }) }).then((x) => x.json()).catch(() => ({ error: "連不上管家" }));
		if (r.ok) location.reload();
		else w.querySelector(".loginerr").textContent = r.error || "登入失敗";
	});
}
// 從 Tailscale 的 http 網址打開時,轉到設定的 https 網址(瀏覽器只在安全來源開放剪貼簿 API)
const PUBLIC_URL = "__STEWARD_PUBLIC_URL__";
if (location.protocol === "http:" && /^100\./.test(location.hostname) && PUBLIC_URL.startsWith("https://")) {
	location.replace(`${PUBLIC_URL.replace(/\/$/, "")}/${location.hash}`);
}
try { fetch("/api/clientlog", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ event: "load", proto: location.protocol, secure: isSecureContext, ua: navigator.userAgent }), keepalive: true }); } catch {}
const COLS = [["proposed", "提案"], ["approved", "已核准"], ["running", "進行中"], ["blocked", "卡住"], ["done", "完成"]];
let state = { projects: [], cards: [], watcher: {} };
let sel = null;
try { sel = localStorage.getItem("steward.sel"); } catch {}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 60 ? `${m} 分鐘前` : m < 1440 ? `${Math.round(m / 60)} 小時前` : `${Math.round(m / 1440)} 天前`; };
const post = (url, data) => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) }).then((r) => r.json());

// ---------- 三個頁面共用的「目前專案」 ----------
// 在看板、程式碼頁面、herdr(網頁終端機看得到時)選的專案,三邊都顯示同一個;存在伺服器跨裝置同步。
let selSource = "";
function selectProject(id, source, { push = true } = {}) {
	if (!id) return;
	const changed = id !== sel;
	sel = id; selSource = source || selSource;
	try { localStorage.setItem("steward.sel", sel); } catch {}
	if (push) fetch("/api/current", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: id, source }) }).catch(() => {});
	if (changed) editing = null;
	render();
	if (document.body.classList.contains("code")) window.codeMode?.pick(id);
	// 在終端機頁換專案(不是 herdr 自己切過去的):herdr 也跟著跳
	if (changed && push && source !== "herdr" && document.body.classList.contains("term")) enterTerminal();
}
/** 其他裝置可能換過:打開網頁、切回分頁時從伺服器拿最後選的(不即時拉走正在看的畫面) */
async function syncCurrent() {
	const r = await fetch("/api/current").then((x) => (x.ok ? x.json() : null)).catch(() => null);
	if (r?.project && state.projects.some((p) => p.id === r.project)) {
		if (r.project !== sel) selectProject(r.project, r.source, { push: false });
		else selSource = r.source || selSource;
	}
}
document.addEventListener("visibilitychange", async () => {
	if (document.hidden) return;
	await syncCurrent();
	if (document.body.classList.contains("term")) enterTerminal();
});
let firstLoad = true;
async function load() {
	try {
		state = await fetch("/api/board").then((r) => r.json());
		const w = state.watcher || {};
		$("status").innerHTML = `<span class="dot ${w.lastError ? "off" : ""}"></span>${w.lastError ? esc(w.lastError) : `監看 ${w.panes?.length ?? 0} 個 agent 窗格`}`;
	} catch { $("status").innerHTML = `<span class="dot off"></span>連不上管家`; }
	if (firstLoad) { firstLoad = false; await syncCurrent(); }
	if (!sel || !state.projects.find((p) => p.id === sel)) sel = (state.projects.filter((p) => p.kind === "project" && p.status === "active").sort(byActivity)[0] || state.projects[0])?.id;
	render();
}
const byActivity = (a, b) => (b.lastActivityAt || b.createdAt).localeCompare(a.lastActivityAt || a.createdAt);

let editing = null; // 改名/拆分面板開著的專案:背景更新時不重畫簡報區,避免洗掉輸入
function render() { renderNav(); if (editing !== sel) { editing = null; renderBrief(); } renderBoard(); renderDrawer(); renderCardPop(); if (typeof syncBall === "function") syncBall(); }
function closeTool() { editing = null; $("tool").innerHTML = ""; }

function renderNav() {
	const open = (p) => state.cards.filter((c) => c.projectId === p.id && (c.column === "proposed" || c.column === "blocked")).length;
	const item = (p) => `<div class="projrow ${p.id === sel ? "sel" : ""}"><button class="proj" data-id="${p.id}">${open(p) ? `<span class="badge">${open(p)}</span>` : ""}${window.codeMode?.hasUnsaved?.(p.id) ? '<span class="unsaved" title="程式碼頁面有還沒存的修改">●</span>' : ""}${p.private ? "🔒 " : ""}${esc(p.name)}<small>${p.lastActivityAt ? ago(p.lastActivityAt) : "尚無紀錄"}</small></button>${p.kind === "project" ? `<button class="pmore" data-pmenu="${p.id}" title="更多動作" aria-label="${esc(p.name)} 的更多動作">⋯</button>` : ""}</div>`;
	const active = state.projects.filter((p) => p.kind === "project" && p.status === "active").sort(byActivity);
	const special = state.projects.filter((p) => p.kind !== "project");
	const pending = state.projects.filter((p) => p.status === "pending");
	// 停止追蹤的專案(資料都還在):只列出有內容的,沒紀錄的「略過」資料夾不列
	const stopped = state.projects.filter((p) => p.status === "ignored" && p.kind === "project" && (p.state?.updatedAt || state.cards.some((c) => c.projectId === p.id)));
	$("nav").innerHTML = `<div class="navacts"><button class="small primary" id="newProject">＋ 建立專案</button><button class="small" id="tidySpaces">整理 spaces</button></div>
		<h2>專案</h2>${active.map(item).join("") || '<div class="empty">還沒有專案</div>'}
		<h2>其他</h2>${special.map(item).join("")}
		${pending.length ? `<h2>要登記成專案嗎?</h2>${pending.map((p) => `<div class="pending"><b>${esc(p.root)}</b><div class="row"><button class="small primary" data-reg="${p.id}">登記</button><button class="small" data-ign="${p.id}">略過</button></div></div>`).join("")}` : ""}
		${stopped.length ? `<details class="stopped"><summary><h2 style="display:inline">已停止追蹤(${stopped.length})</h2></summary>${stopped.map((p) => `<div class="pending"><b>${esc(p.name)}</b><span class="hint">${esc(p.root)}${p.state?.updatedAt ? ` · 紀錄保留到 ${ago(p.state.updatedAt)}` : ""}</span><div class="row"><button class="small primary" data-reg="${p.id}" title="恢復追蹤:之前的進度、工作卡、管家記憶都會回來">恢復追蹤</button></div></div>`).join("")}</details>` : ""}`;
}

function renderBrief() {
	const p = state.projects.find((x) => x.id === sel);
	if (!p) { $("brief").innerHTML = '<div class="empty">選一個專案</div>'; return; }
	const s = p.state || {};
	const list = (t, a) => a?.length ? `<h4>${t}</h4><ul>${a.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : "";
	const si = state.spaceInfo?.[p.id];
	const spaceLine = p.kind !== "project" ? "" : si?.label
		? `<div class="spaceline"><span class="chip">herdr space:${esc(si.label)}</span>
			${si.nameDiffers ? `<span class="warn">名稱和專案不同</span><button class="small" data-spacename="space">專案改名為「${esc(si.label)}」</button><button class="small" data-spacename="project">space 改回「${esc(p.name)}」</button>` : ""}
			${si.strays ? `<span class="warn">有 ${si.strays} 個窗格在別的 space</span><button class="small primary" data-strays="1">搬過去</button>` : ""}</div>`
		: `<div class="spaceline"><span class="chip dim">還沒有綁定 herdr space</span><span class="hint">跳轉或派工時會自動建立,也可以用「整理 spaces」</span></div>`;
	$("brief").innerHTML = `<h3>${p.private ? "🔒 " : ""}${esc(p.name)}</h3><div class="path">${esc(p.root)}${s.updatedAt ? ` · 更新於 ${ago(s.updatedAt)}` : ""}</div>${spaceLine}
		${s.goal ? `<h4>目標</h4><p>${esc(s.goal)}</p>` : ""}
		${s.progress ? `<h4>目前進度</h4><p>${esc(s.progress)}</p>` : `<p class="empty">管家還沒有這個專案的紀錄。agent 收工後會自動整理${p.kind === "project" ? ',或現在就從現有記錄補建。</p><p><button class="small primary" id="bootstrap">從現有記錄補建</button>' : "。"}</p>`}
		<div class="grid"><div>${list("下一步", s.nextSteps)}</div><div>${list("卡住的地方", s.blockers)}</div></div>
		${s.decisions?.length ? `<details><summary><b style="font-size:12px;color:var(--muted)">重要決定(${s.decisions.length})</b></summary>${list("", s.decisions)}</details>` : ""}
		${s.recent?.length ? `<h4>最近的工作</h4><ul>${s.recent.slice(0, 6).map((r) => `<li>${ago(r.at)} · ${esc(r.agent)}:${esc(r.summary)}</li>`).join("")}</ul>` : ""}

function popMenu(x, y, items) {
	document.querySelector(".cv-menu")?.remove();
	const m = document.createElement("div");
	m.className = "cv-menu";
	m.setAttribute("role", "menu");
	for (const it of items) {
		const b = document.createElement("button");
		b.textContent = it.label;
		b.setAttribute("role", "menuitem");
		if (it.danger) b.style.color = "var(--bad)";
		b.onclick = (e) => { e.stopPropagation(); m.remove(); it.run(); };
		m.appendChild(b);
	}
	document.body.appendChild(m);
	const r = m.getBoundingClientRect();
	m.style.left = `${Math.max(8, Math.min(x, innerWidth - r.width - 8))}px`;
	m.style.top = `${Math.max(8, Math.min(y, innerHeight - r.height - 8))}px`;
	m.querySelector("button")?.focus();
	const close = (e) => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("pointerdown", close, true); } };
	// 選單是在 click 時打開的(pointerdown 已經過去了),所以可以立刻開始監聽「點外面」
	document.addEventListener("pointerdown", close, true);
	m.addEventListener("keydown", (e) => { if (e.key === "Escape") m.remove(); });
}
function miniDialog({ title, html, okLabel, danger, onOk }) {
	const w = document.createElement("div");

	w.innerHTML = `<div class="box" role="dialog" style="width:min(460px,100%)"><div class="mhead"><h3>${esc(title)}</h3><button class="small" data-x>取消</button></div><div class="mbody">${html}</div><div class="mfoot"><button class="small ${danger ? "" : "primary"}" data-ok ${danger ? 'style="color:var(--bad);border-color:var(--bad)"' : ""}>${esc(okLabel)}</button></div></div>`;
	const close = () => w.remove();
	w.querySelector("[data-x]").onclick = close;
	w.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); if (e.key === "Enter" && e.target.tagName === "INPUT") w.querySelector("[data-ok]").click(); });
	w.querySelector("[data-ok]").onclick = async () => { if ((await onOk(w)) !== false) close(); };
	document.body.appendChild(w);
	setTimeout(() => (w.querySelector("input") || w.querySelector("[data-ok]")).focus(), 30);
}

function syncDots() {
	const cols = [...$("board").querySelectorAll(".col")];
	if (innerWidth > 800 || !cols.length) { $("bdots").innerHTML = ""; return; }
	const left = $("board").scrollLeft;
	let cur = 0;

	const b = $("board");
	if (left + b.clientWidth >= b.scrollWidth - 4) cur = cols.length - 1; // 捲到底:最後一欄
	$("bdots").innerHTML = cols.map((c, i) => `<button type="button" data-dot="${i}" class="${i === cur ? "on" : ""}" aria-label="${esc(c.querySelector("h4 span")?.textContent ?? "")}"></button>`).join("");
}

function renderBoard() {
	const all = $("allCards").checked;

	const pname = (id) => state.projects.find((p) => p.id === id)?.name ?? "?";

		const list = cards.filter((c) => c.column === col).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));

// ---------- 拖拉(滑鼠與觸控共用 pointer events) ----------
let drag = null;
$("board").addEventListener("pointerdown", (e) => {
	const card = e.target.closest(".kcard");
	if (!card || e.target.closest("button")) return;
	drag = { id: card.dataset.card, el: card, startX: e.clientX, startY: e.clientY, ghost: null, touch: e.pointerType === "touch", pid: e.pointerId };
	// 觸控先不抓住指標:上下滑要留給欄位捲動,左右拖才算換欄
	if (!drag.touch) card.setPointerCapture(e.pointerId);
});
$("board").addEventListener("pointermove", (e) => {
	if (!drag) return;
	if (!drag.ghost) {
		const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
		if (Math.hypot(dx, dy) < 6) return;
		if (drag.touch) {
			if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; } // 上下滑 = 捲動
			try { drag.el.setPointerCapture(drag.pid); } catch {}
		}
		drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add("ghost"); document.body.appendChild(drag.ghost); drag.el.classList.add("dragging");
	}
	drag.ghost.style.left = `${e.clientX - 20}px`; drag.ghost.style.top = `${e.clientY - 20}px`;
	document.querySelectorAll(".col").forEach((c) => c.classList.remove("over"));
	drag.ghost.style.display = "none"; const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".col"); drag.ghost.style.display = "";
	if (under) under.classList.add("over");
});
const endDrag = (e) => {
	if (!drag) return;
	const d = drag; drag = null;
	document.querySelectorAll(".col").forEach((c) => c.classList.remove("over"));
	if (!d.ghost) return; // 沒拖動 = 點一下,交給下面的 click 開資訊卡
	lastDragEnd = Date.now();
	d.ghost.style.display = "none"; const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".col"); d.ghost.remove(); d.el.classList.remove("dragging");
	if (under && under.dataset.col) move(d.id, under.dataset.col);
};
$("board").addEventListener("pointerup", endDrag);
// 點一下開資訊卡:用 click(手機在 pointerup 就開的話,緊接著的 click 會落在遮罩上把它關掉);剛拖完的那下不算
let lastDragEnd = 0;
$("board").addEventListener("click", (e) => {
	const card = e.target.closest(".kcard");
	if (!card || e.target.closest("button") || Date.now() - lastDragEnd < 120) return;
	openCard(card.dataset.card);
});
$("board").addEventListener("pointercancel", endDrag);

async function move(id, col) {

	const j = $("dJump"); if (j) j.onclick = () => enterTerminal({ create: true });
}
$("modeBoard").onclick = () => setMode("board");
$("modeTerm").onclick = () => setMode("term");
$("modeCode").onclick = () => setMode("code");
$("fontUp").onclick = () => { fontSize = Math.min(24, fontSize + 1); pref("steward.font", fontSize); applyFont(); };
$("fontDown").onclick = () => { fontSize = Math.max(10, fontSize - 1); pref("steward.font", fontSize); applyFont(); };
$("drawerBtn").onclick = () => toggleDrawer();
$("drawerClose").onclick = () => toggleDrawer(false);
$("fontSize").textContent = fontSize;

// ---------- 即時更新 ----------
let timer;
function connect() {
	const es = new EventSource("/api/events");
	es.onmessage = () => { clearTimeout(timer); timer = setTimeout(() => { if (!drag) load(); }, 300); };
	es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}
// ---------- 捲動漸層提示 ----------
function updateFade(el) {
	const top = el.scrollTop > 2, bottom = el.scrollTop + el.clientHeight < el.scrollHeight - 2;
	if (el.classList.contains("fade-t") !== top) el.classList.toggle("fade-t", top);
	if (el.classList.contains("fade-b") !== bottom) el.classList.toggle("fade-b", bottom);
}
document.addEventListener("scroll", (e) => { if (e.target.classList?.contains("sfade")) updateFade(e.target); }, true);
setInterval(() => { if (!document.hidden) document.querySelectorAll(".sfade").forEach(updateFade); }, 800);

// ---------- 問管家浮動球 ----------
// 三個頁面共用;問的永遠是「目前專案」。紀錄存在伺服器(全部保留),先載最近的,往上捲再載更早的。
const ball = { open: false, pid: null, items: [], more: false, loading: false, pending: new Map(), quote: null, clearArmed: 0 };
function setBallCorner(c) {
	if (c) pref("steward.ballCorner", c);
	const v = pref("steward.ballCorner");
	$("ballWrap").dataset.corner = ["br", "bl", "tr", "tl"].includes(v) ? v : "br";
}
setBallCorner();
(() => {
	const el = $("stewardBall");
	let d = null;
	el.addEventListener("pointerdown", (e) => { d = { x: e.clientX, y: e.clientY, moved: false }; el.setPointerCapture(e.pointerId); });
	el.addEventListener("pointermove", (e) => {
		if (!d) return;
		if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 8) return;
		d.moved = true;
		el.classList.add("dragging");
		Object.assign(el.style, { left: `${e.clientX - 26}px`, top: `${e.clientY - 26}px`, right: "auto", bottom: "auto" });
	});
	const end = (e) => {
		if (!d) return;
		const moved = d.moved; d = null;
		el.classList.remove("dragging");
		if (!moved) { if (e.type === "pointerup") toggleBall(); return; }
		el.style.left = el.style.top = el.style.right = el.style.bottom = "";
		// 放開:吸到最近的角落
		setBallCorner(`${e.clientY < innerHeight / 2 ? "t" : "b"}${e.clientX < innerWidth / 2 ? "l" : "r"}`);
	};
	el.addEventListener("pointerup", end);
	el.addEventListener("pointercancel", end);
})();
function toggleBall(open = !ball.open) {
	ball.open = open;
	$("ballPanel").hidden = !open;
	$("stewardBall").classList.toggle("on", open);
	if (open) {
		$("stewardBall").classList.remove("unread");
		ball.pid = null; // 每次打開都重新載入(別的裝置可能問過)
		syncBall();
		// 觸控裝置不自動聚焦(會跳出鍵盤蓋住半個畫面)
		if (!matchMedia("(pointer: coarse)").matches) setTimeout(() => $("bpInput").focus(), 30);
	} else if (document.body.classList.contains("term")) focusTerm();
}
/** 目前專案變了 → 面板換成那個專案的紀錄 */
function syncBall() {
	const p = state.projects.find((x) => x.id === sel);
	$("bpTitle").textContent = p ? `問管家 · ${p.name}` : "問管家";
	if (!ball.open || !sel || ball.pid === sel) return;
	ball.pid = sel; ball.items = []; ball.more = false;
	loadBall(false);
	loadSuggest(sel);
}
async function loadBall(older) {
	if (ball.loading || !ball.pid) return;
	ball.loading = true;
	const pid = ball.pid, before = older ? ball.items[0]?.id : "";
	const r = await fetch(`/api/chat/${encodeURIComponent(pid)}?limit=30${before ? `&before=${encodeURIComponent(before)}` : ""}`).then((x) => (x.ok ? x.json() : null)).catch(() => null);
	ball.loading = false;
	if (!r || pid !== ball.pid) return;
	const log = $("bpLog"), prevH = log.scrollHeight, prevTop = log.scrollTop;
	ball.items = older ? [...r.items, ...ball.items] : r.items;
	ball.more = r.more;
	renderBall();
	log.scrollTop = older ? log.scrollHeight - prevH + prevTop : 1e9;
}
const quoteLabel = (q) => `${q.path ?? ""}${q.from ? ` 第 ${q.from}${q.to && q.to !== q.from ? `–${q.to}` : ""} 行` : ""}`;
function msgHtml(e) {
	const q = e.quote ? `<div class="q"><div>引用 ${esc(quoteLabel(e.quote))}</div><pre>${esc(e.quote.text)}</pre></div>` : "";
	const cloud = e.alt ? `<span class="cloud" title="這一則用備用模型回答:${esc(e.alt)}">備用 · ${esc(e.alt)}</span>` : e.cloud ? '<span class="cloud" title="這一則用雲端模型回答">雲端</span>' : "";
	const retry = e.retryable ? `<button class="small retry" data-retry="${esc(e.id)}">改用備用模型回答這一題</button>` : "";
	return `<div class="msg ${e.role}${e.error ? " err" : ""}">${q}${cloud}${esc(e.text)}${retry}</div>`;
}
function renderBall() {
	const waiting = ball.pending.get(ball.pid) || 0;
	$("bpLog").innerHTML = (ball.more ? '<div class="bp-more">往上捲載入更早的…</div>' : "")
		+ (ball.items.length || waiting ? ball.items.map(msgHtml).join("") : '<div class="empty">問管家關於這個專案的事:進度、下一步、卡在哪裡,或貼一段程式碼問它。</div>')
		+ (waiting ? '<div class="msg bot wait">思考中…</div>' : "");
	$("stewardBall").classList.toggle("busy", [...ball.pending.values()].some(Boolean));
}
function renderQuote() {
	const q = ball.quote, box = $("bpQuote");
	box.hidden = !q;
	box.innerHTML = q ? `<div class="qh"><span>引用 ${esc(quoteLabel(q))}</span><button class="small" data-unquote title="拿掉引用">×</button></div><pre>${esc(q.text)}</pre>` : "";
}
$("bpLog").addEventListener("scroll", () => { if ($("bpLog").scrollTop < 40 && ball.more && !ball.loading) loadBall(true); });
$("bpQuote").addEventListener("click", (e) => { if (e.target.closest("[data-unquote]")) { ball.quote = null; renderQuote(); } });
$("bpClose").onclick = () => toggleBall(false);
$("bpClear").onclick = async () => {
	if (Date.now() - ball.clearArmed > 3000) { ball.clearArmed = Date.now(); $("bpClear").textContent = "再按一次清除"; setTimeout(() => { $("bpClear").textContent = "清除紀錄"; }, 3000); return; }
	ball.clearArmed = 0; $("bpClear").textContent = "清除紀錄";
	await fetch(`/api/chat/${encodeURIComponent(ball.pid)}`, { method: "DELETE" }).catch(() => {});
	ball.items = []; ball.more = false; renderBall();
	toast("已清除這個專案的問答紀錄");
};
$("bpInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("bpForm").requestSubmit(); });
async function askBall(text, quote, opts = {}) {
	const pid = sel;
	if ((!text && !quote) || !pid) return;
	let temp = null;
	if (!opts.retry) {
		temp = { id: `tmp-${Date.now()}`, role: "me", text, quote };
		if (ball.pid === pid) ball.items.push(temp);
	}
	ball.pending.set(pid, (ball.pending.get(pid) || 0) + 1);
	renderBall(); renderSugg(); $("bpLog").scrollTop = 1e9;
	const prevAt = ball.sugg.pid === pid ? ball.sugg.at : null;
	const r = await post("/api/chat", { project: pid, message: text, quote, ...(opts.cloud ? { fallback: true, retry: !!opts.retry } : {}) }).catch((err) => ({ error: `連不上管家:${err}` }));
	ball.pending.set(pid, Math.max(0, (ball.pending.get(pid) || 1) - 1));
	if (ball.pid === pid) {
		const i = temp ? ball.items.indexOf(temp) : -1;
		if (i >= 0 && r.me) ball.items[i] = r.me;
		ball.items.push(r.bot || { id: `tmp-${Date.now()}`, role: "bot", text: r.answer || r.error || "沒有回應", error: !r.answer });
		renderBall(); $("bpLog").scrollTop = 1e9;
	}
	// 面板沒開、或已經換到別的專案:球上亮小紅點
	if (!ball.open || ball.pid !== pid) $("stewardBall").classList.add("unread");
	renderSugg();
	if (r.answer) waitSuggest(pid, prevAt); // 回答完,伺服器會在背景產生下一組建議問題
	load();
}
$("bpForm").onsubmit = (e) => {
	e.preventDefault();
	const text = $("bpInput").value.trim(), quote = ball.quote;
	if (!text && !quote) return;
	$("bpInput").value = ""; ball.quote = null; renderQuote();
	askBall(text, quote);
};
// 失敗的回答:「改用雲端回答這一題」→ 用前一則問題重問
$("bpLog").addEventListener("click", (e) => {
	const id = e.target.closest("[data-retry]")?.dataset.retry;
	if (!id) return;
	const i = ball.items.findIndex((x) => x.id === id);
	const me = ball.items.slice(0, i).reverse().find((x) => x.role === "me");
	if (!me) return toast("找不到原本的問題");
	ball.items[i] = { ...ball.items[i], retryable: false };
	askBall(me.text, me.quote, { cloud: true, retry: true });
});
// ---------- 三個建議問題 ----------
ball.sugg = { pid: null, items: [], at: null, loading: false };
async function loadSuggest(pid, { ensure = true, regen = false } = {}) {
	if (ball.sugg.pid !== pid) ball.sugg = { pid, items: [], at: null, loading: false };
	ball.sugg.loading = true; renderSugg();
	const r = await fetch(`/api/chat/${encodeURIComponent(pid)}/suggest${regen ? "" : ensure ? "?ensure=1" : ""}`, { method: regen ? "POST" : "GET" }).then((x) => (x.ok ? x.json() : null)).catch(() => null);
	if (ball.sugg.pid !== pid) return;
	ball.sugg.loading = false;
	if (r) { ball.sugg.items = r.items || []; ball.sugg.at = r.at; }
	renderSugg();
	return r;
}
/** 等伺服器換上新一組(最多約 60 秒) */
async function waitSuggest(pid, prevAt) {
	for (let n = 0; n < 30; n++) {
		await new Promise((ok) => setTimeout(ok, 2000));
		if (ball.sugg.pid !== pid) return;
		const r = await fetch(`/api/chat/${encodeURIComponent(pid)}/suggest`).then((x) => (x.ok ? x.json() : null)).catch(() => null);
		if (r && r.at && r.at !== prevAt) { ball.sugg.items = r.items || []; ball.sugg.at = r.at; renderSugg(); return; }
		if (r && !r.pending && n > 3) return; // 背景產生失敗就算了(不顯示錯誤)
	}
}
function renderSugg() {
	const box = $("bpSugg");
	const busy = (ball.pending.get(ball.pid) || 0) > 0;
	const items = ball.sugg.pid === ball.pid ? ball.sugg.items : [];
	box.hidden = !items.length && !ball.sugg.loading;
	box.classList.toggle("dim", busy || ball.sugg.loading);
	box.innerHTML = items.length
		? `<div class="chips">${items.map((q) => `<button type="button" class="chip-q" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div><button type="button" class="small sref" data-sref title="換一組建議問題">↻</button>`
		: `<div class="chips"><span class="hint">建議問題產生中…</span></div>`;
}
$("bpSugg").addEventListener("click", (e) => {
	const q = e.target.closest("[data-q]")?.dataset.q;
	if (q) return askBall(q, null);
	if (e.target.closest("[data-sref]") && ball.pid) loadSuggest(ball.pid, { regen: true });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ball.open && !document.querySelector(".modal:not([hidden]):not(#cardPop)") && !$("cardPop")) toggleBall(false); });
/** 給程式碼頁面用:帶著選取的程式打開面板 */
window.openStewardChat = ({ quote } = {}) => {
	if (quote) { ball.quote = quote; renderQuote(); }
	if (!ball.open) toggleBall(true); else setTimeout(() => $("bpInput").focus(), 30);
};

load().then(() => { if (location.hash === "#terminal") setMode("term"); if (location.hash === "#code") setMode("code"); }); connect();
</script>
<script src="/web/code.js"></script>
